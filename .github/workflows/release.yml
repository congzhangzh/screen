name: Build, test and release screen

# Builds a branch or commit (normally integration-screen) as a Debian package and a binary
# tarball in Debian testing, runs ci/test.sh against it and against an unfixed control, and,
# with "pick", picks the tested commit as a release: branch release-YYYYMMDD.N plus a GitHub
# Release r<YYYYMMDD>.<N> carrying the .deb, the tarball and SHA256SUMS.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        default: integration-screen
      control:
        description: Upstream branch for the control build (the same code without our fixes)
        default: screen-v5
      pick:
        description: Pick a release when every test passes
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:testing
    timeout-minutes: 30
    steps:
      - name: Get the pipeline and the screen source
        env:
          REF: ${{ inputs.ref }}
          PICK: ${{ inputs.pick }}
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates > /dev/null
          git clone -q --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" pipe
          git clone -q --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" screen
          sha=$(git -C screen rev-parse --verify -q "origin/$REF^{commit}" || git -C screen rev-parse --verify "$REF^{commit}")
          if [ "$PICK" = true ]; then
            day=$(date -u +%Y%m%d)
            n=$(( $(git -C screen ls-remote --heads origin "release-$day.*" | wc -l) + 1 ))
            name=release-$day.$n tag=r$day.$n
          else
            name='' tag=ci$GITHUB_RUN_NUMBER.${sha:0:7}
          fi
          printf 'SHA=%s\nNAME=%s\nTAG=%s\n' "$sha" "$name" "$tag" | tee -a "$GITHUB_ENV"

      - name: Build and test
        env:
          REF: ${{ inputs.ref }}
          CONTROL: ${{ inputs.control }}
        run: pipe/ci/run.sh screen "$SHA" "origin/$CONTROL" "$TAG" out

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-${{ env.TAG }}
          path: |
            out/*.deb
            out/*.tar.gz
            out/SHA256SUMS
            out/test.log
          if-no-files-found: ignore

      - name: Pick the release
        if: inputs.pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          CONTROL: ${{ inputs.control }}
        run: |
          apt-get install -y -q --no-install-recommends gh > /dev/null
          . out/build.env
          base=$(git -C screen merge-base "$SHA" "origin/$CONTROL")
          deb=$(cd out && ls screen_*_amd64.deb)
          tgz=$(cd out && ls screen-*.tar.gz)
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            echo "screen \`$version\`, built from \`$REF\` @ \`${SHA:0:12}\` and tested in Debian testing."
            echo
            echo "**Base:** upstream \`$CONTROL\` @ $(git -C screen log -1 --format='`%h` %s' "$base")"
            echo
            echo "**Our commits on top:**"
            git -C screen log --reverse --format='- `%h` %s' "$base..$SHA"
            echo
            echo "**Packaging:** Debian's screen 5.0.2-1, without the patches upstream already has (91, 95, 98, 99, 100)."
            echo
            echo "**Tests** (\`ci/test.sh\`):"
            grep -E 'crashed \(|control crashed' out/test.log | sed -E 's/ \(work dir.*//; s/^/- /'
            echo
            echo "**Install** (Debian testing/unstable):"
            echo '```'
            echo "sudo apt install ./$deb"
            echo '```'
            echo "or, beside Debian's package, into \`~/.local\`:"
            echo '```'
            echo "mkdir -p ~/.local/lib/screen && tar -xzf $tgz -C ~/.local/lib/screen"
            echo "ln -sfn ~/.local/lib/screen/${tgz%-linux-*}/bin/screen ~/.local/bin/screen"
            echo '```'
          } > out/notes.md
          cat out/notes.md
          git -C screen config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C screen push origin "$SHA:refs/heads/$NAME"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "screen $version" --notes-file out/notes.md \
            out/*.deb out/*.tar.gz out/SHA256SUMS
